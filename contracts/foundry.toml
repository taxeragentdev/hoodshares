[profile.default]
src = "src"
out = "out"
libs = ["lib"]
optimizer = true
optimizer_runs = 800
solc_version = "0.8.26"

remappings = [
    "@openzeppelin/=lib/openzeppelin-contracts/",
    "forge-std/=lib/forge-std/src/",
]

[rpc_endpoints]
robinhood_mainnet = "https://rpc.mainnet.chain.robinhood.com"
robinhood_testnet = "https://rpc.testnet.chain.robinhood.com"

[etherscan]
robinhood_mainnet = { key = "empty", url = "https://robinhoodchain.blockscout.com/api", chain = 4663 }
robinhood_testnet = { key = "empty", url = "https://explorer.testnet.chain.robinhood.com/api", chain = 46630 }

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
